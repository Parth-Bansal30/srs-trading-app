<title>SRS Steel Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ground:#E4EAF0;--bg:#F4F6F8;--card:#FFFFFF;--ink:#1B2733;--mute:#5B6C7F;--line:#DCE3EA;
  --navy:#16324F;--blue:#2F6690;--amber:#F5A623;--amber-ink:#2B1C00;--green:#1E9E5A;--red:#D64545;
  --c-pakka-bg:#DCEAF7;--c-pakka:#1B4F82;--c-kacha-bg:#FFE9C7;--c-kacha:#7A4900;--c-ok-bg:#D8F3E4;--c-ok:#12703F;--c-bad-bg:#FBDADA;--c-bad:#A22B2B;
  --info-bg:#EAF2FB;--info:#24486F;--warn-bg:#FFF3CC;--warn:#6B4A00;--seg:#E3E9EF;--shadow:0 1px 2px rgba(20,40,70,.10);
  --f:'Mukta','Noto Sans Devanagari','Noto Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0A1119;--bg:#0E1620;--card:#17222E;--ink:#E7EDF3;--mute:#9BAABB;--line:#263545;--navy:#1B3B5E;--blue:#6FA8DC;
  --c-pakka-bg:#1D3A57;--c-pakka:#A9D0F5;--c-kacha-bg:#4A3510;--c-kacha:#FFD48A;--c-ok-bg:#15402B;--c-ok:#8FE0B4;--c-bad-bg:#4A1E1E;--c-bad:#FFB0B0;
  --info-bg:#182B40;--info:#B7D3F0;--warn-bg:#4A3A10;--warn:#FFE49A;--seg:#1F2D3B;--shadow:none}}
:root[data-theme="dark"]{
  --ground:#0A1119;--bg:#0E1620;--card:#17222E;--ink:#E7EDF3;--mute:#9BAABB;--line:#263545;--navy:#1B3B5E;--blue:#6FA8DC;
  --c-pakka-bg:#1D3A57;--c-pakka:#A9D0F5;--c-kacha-bg:#4A3510;--c-kacha:#FFD48A;--c-ok-bg:#15402B;--c-ok:#8FE0B4;--c-bad-bg:#4A1E1E;--c-bad:#FFB0B0;
  --info-bg:#182B40;--info:#B7D3F0;--warn-bg:#4A3A10;--warn:#FFE49A;--seg:#1F2D3B;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column}
@media(min-width:700px){#app{margin:16px auto;min-height:calc(100vh - 32px);border-radius:24px;overflow:clip;box-shadow:0 12px 40px rgba(10,30,60,.25)}}
.mono{font-variant-numeric:tabular-nums}
/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 14px 14px}
.bar .ttl{flex:1;min-width:0}.bar h1{margin:0;font-size:22px;line-height:1.1;font-weight:700}.bar .sub{font-size:13px;opacity:.85;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.ib:active{background:rgba(255,255,255,.15)}
.lang{min-width:46px;height:36px;border-radius:18px;background:rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:15px;padding:0 12px;flex:none}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--amber);color:var(--amber-ink);font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* layout */
.body{padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px;flex:1}
.card{background:var(--card);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow)}
.card.flush{padding:0;overflow:hidden}
.h2{font-size:15px;font-weight:700;color:var(--blue);margin:4px 2px -4px;letter-spacing:.2px}
.muted{color:var(--mute)}.small{font-size:13px}.xs{font-size:12px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.info{background:var(--info-bg);color:var(--info);border-radius:14px;padding:11px 14px;font-size:14px;line-height:1.4}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:11px 14px;font-size:14px;line-height:1.4}
.proto{background:var(--warn-bg);color:var(--warn);font-size:12.5px;padding:7px 16px;text-align:center;font-weight:600}
/* buttons */
.btn{min-height:54px;border-radius:14px;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;text-align:center;text-decoration:none;flex:1}
.btn:active{transform:scale(.985)}.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.b-amber{background:var(--amber);color:var(--amber-ink)}.b-green{background:var(--green);color:#fff}.b-navy{background:var(--navy);color:#fff}
.b-out{background:var(--card);border:2px solid var(--navy);color:var(--ink)}.b-red{background:var(--c-bad-bg);color:var(--c-bad)}
.btn.sm{min-height:44px;font-size:15px;border-radius:12px}
.link{color:var(--blue);font-weight:700;font-size:15px;padding:6px 2px}
.dock{position:sticky;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.dock .tot{display:flex;justify-content:space-between;align-items:baseline}.dock .tot span{color:var(--mute);font-size:15px}.dock .tot b{font-size:27px;color:var(--ink)}
.dock .acts{display:flex;gap:10px}
/* chips & segs */
.chip{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.c-pakka{background:var(--c-pakka-bg);color:var(--c-pakka)}.c-kacha{background:var(--c-kacha-bg);color:var(--c-kacha)}.c-ok{background:var(--c-ok-bg);color:var(--c-ok)}.c-bad{background:var(--c-bad-bg);color:var(--c-bad)}.c-blue{background:var(--c-pakka-bg);color:var(--c-pakka)}.c-amber{background:var(--c-kacha-bg);color:var(--c-kacha)}
.seg{display:flex;background:var(--seg);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:11px 4px;border-radius:11px;font-weight:700;font-size:15px;color:var(--mute);min-height:44px}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 1 45%}
.seg button.on{background:var(--navy);color:#fff}.seg.amb button.on{background:var(--amber);color:var(--amber-ink)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.pill{flex:none;padding:9px 16px;border-radius:22px;background:var(--seg);font-weight:700;font-size:15px;color:var(--mute)}.pill.on{background:var(--navy);color:#fff}
/* tiles */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:20px;padding:14px;min-height:124px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;position:relative}
.tile b{font-size:19px;line-height:1.15;display:block;font-weight:700}.tile small{font-size:13.5px;opacity:.92;display:block;margin-top:3px}
.tile .ic{width:34px;height:34px}
.t-amber{background:var(--amber);color:var(--amber-ink)}.t-blue{background:#2F6690;color:#fff}.t-green{background:#1E9E5A;color:#fff}.t-navy{background:#16324F;color:#fff}
.t-plain{background:var(--card);color:var(--ink);border:1px solid var(--line)}.t-plain .ic{color:var(--blue)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t-navy{background:#22466E}}
.badge{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;font-size:13px;font-weight:800;min-width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;padding:0 7px}
/* lists */
.li{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li:last-child{border-bottom:0}.li .no{font-weight:800;color:var(--blue);min-width:50px}.li .nm{flex:1;min-width:0}.li .nm b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .amt{text-align:right}.li .amt b{display:block;font-size:17px}
.stripe{border-left:6px solid var(--line)}.stripe.old{border-left-color:var(--red)}.stripe.mid{border-left-color:var(--amber)}.stripe.adv{border-left-color:var(--green)}
/* forms */
label.f{display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--mute);font-weight:600;min-width:0}
.in,select.in{height:50px;border-radius:12px;border:2px solid var(--line);background:var(--card);padding:0 12px;font-size:18px;font-weight:600;width:100%;min-width:0;color:var(--ink)}
.in:focus,select.in:focus{outline:none;border-color:var(--blue)}
.in.big{height:62px;font-size:28px;font-weight:800;border-color:var(--blue)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg .full{grid-column:1/-1}
.unit{position:relative}.unit .in{padding-right:44px}.unit i{position:absolute;right:12px;bottom:14px;font-style:normal;color:var(--mute);font-size:14px;font-weight:600;pointer-events:none}
/* order item */
.item .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.num{width:28px;height:28px;border-radius:50%;background:var(--amber);color:var(--amber-ink);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.matbtn{display:flex;align-items:center;gap:8px;width:100%;min-height:56px;border:2px solid var(--line);border-radius:14px;padding:6px 8px 6px 12px;background:var(--card);text-align:left}
.matbtn b{font-size:20px}.matbtn .fam{font-size:12.5px;color:var(--mute);display:block;margin-top:-2px}
.infob{width:40px;height:40px;border-radius:50%;background:var(--info-bg);color:var(--info);font-weight:800;font-size:19px;font-family:Georgia,serif;font-style:italic;display:flex;align-items:center;justify-content:center;flex:none;border:2px solid var(--info)}
.quote{display:flex;gap:8px;margin-top:8px}
.quote>div{flex:1;background:var(--seg);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;min-width:0}
.quote small{color:var(--mute);font-size:12px;font-weight:600}.quote b{font-size:17px;color:var(--ink)}
.hint{margin-top:12px;background:var(--info-bg);color:var(--info);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.35;display:flex;flex-direction:column;gap:8px}
.hint .row{flex-wrap:wrap}
.seg.mini{display:inline-flex;padding:3px}.seg.mini button{flex:none;padding:6px 16px;min-height:36px;font-size:14px}
.is-off{opacity:.5}
.gsearch{display:flex;align-items:center;gap:10px;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;color:var(--mute);font-size:16px;text-align:left;box-shadow:var(--shadow)}
.gsearch .ic{color:var(--blue);width:22px;height:22px;flex:none}
.gcard{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.gcard summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px}.gcard summary::-webkit-details-marker{display:none}
.gcard summary::after{content:'▾';color:var(--mute);font-size:18px}.gcard[open] summary::after{content:'▴'}
.gb{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
.gh{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--c-ok);margin-top:6px}.gh.bad{color:var(--c-bad)}
.grow{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.35}
.gchip{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--seg);border-radius:999px;padding:4px 8px 4px 12px;font-weight:800;color:var(--ink);font-size:14px;min-height:34px}
.gchip .gi{width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;font-style:italic;font-family:Georgia,serif;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.grow.best .gchip{background:var(--c-ok-bg);color:var(--c-ok)}.grow.no .gchip{background:var(--c-bad-bg);color:var(--c-bad)}
.grow>span:last-child{padding-top:5px}
.gtxt{font-size:15px;line-height:1.4}
.gsay{background:var(--info-bg);color:var(--info);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.4;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.askout{margin-top:12px;background:var(--seg);border-radius:12px;padding:12px;white-space:pre-wrap;line-height:1.45;font-size:15px}
textarea.in{resize:vertical;min-height:84px;width:100%;font:inherit}
.exs{display:flex;flex-wrap:wrap;gap:8px}
.calc{margin-top:10px;border-top:1px dashed var(--line)}
.ln{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line);line-height:1.3}
.ln span:first-child{color:var(--mute)}.ln b{white-space:nowrap;text-align:right}
.ln.big{font-size:17px;border-bottom:0;border-top:2px solid var(--line);margin-top:2px;padding-top:8px}.ln.big span:first-child{color:var(--ink);font-weight:700}
.dash{border:2px dashed var(--mute);border-radius:14px;min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--blue);font-weight:700;font-size:17px;width:100%}
.dash.sm{min-height:40px;font-size:14px;border-width:1.5px;margin-top:2px}
.rowline{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-bottom:10px}
.rowline .f{flex:1;min-width:74px}
.rowline .rmrow{flex:none;height:50px;display:flex;align-items:center;color:var(--red)}
.wchk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--card);flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.wchk.on{background:var(--blue);border-color:var(--blue)}
.wchk .ic{width:16px;height:16px}
.card.item.wsel{border:2px solid var(--blue)}
.ratebtn{color:var(--blue);font-weight:800;border-bottom:2px dotted var(--blue)}
/* bal cards */
.bal{background:var(--navy);color:#fff;border-radius:18px;padding:16px}
.bal small{opacity:.85;font-size:14px}.bal .big{font-size:36px;font-weight:800;margin:0 0 8px;line-height:1.1}
.bal .sp2{display:flex;gap:8px;flex-wrap:wrap}.bal .sp2 span{background:rgba(255,255,255,.16);border-radius:10px;padding:5px 10px;font-size:13.5px;font-weight:700}
.two{display:flex;gap:10px}.two .card{flex:1}.two small{display:block;font-size:13px;color:var(--mute)}.two b{font-size:23px}
.three{display:flex;gap:8px}
.threecell{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border:2px solid transparent}
.threecell small{font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
.threecell b{font-size:21px;margin:1px 0}
.threecell.sel{border-color:var(--navy)}
.tx{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.tx:last-child{border-bottom:0}.tx .d{width:50px;font-size:13px;color:var(--mute);line-height:1.2}.tx .m{flex:1;min-width:0;font-size:15px}.tx .m small{display:block;color:var(--mute);font-size:12.5px}
.tx .a{text-align:right;font-weight:800;font-size:15.5px}.tx .a small{display:block;color:var(--mute);font-weight:500;font-size:12px}
.plus{color:var(--ink)}.minus{color:var(--green)}
.search{display:flex;align-items:center;gap:10px;height:50px;border-radius:14px;background:var(--card);border:2px solid var(--line);padding:0 12px;color:var(--mute)}
.search input{border:0;background:none;outline:none;flex:1;font-size:17px;min-width:0}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line)}.kv:last-child{border-bottom:0}
.kv small{display:block;color:var(--mute);font-size:12.5px}.kv b{font-size:20px}.kv .l{font-size:16px;font-weight:700}
.bar2{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:8px 0 6px;background:rgba(255,255,255,.16)}.bar2 i{display:block;height:100%}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
/* opt */
.opt{display:flex;align-items:center;gap:12px;border-radius:16px;background:var(--card);border:2px solid var(--line);padding:14px;width:100%;text-align:left}
.opt .rad{width:26px;height:26px;border-radius:50%;border:3px solid var(--mute);flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.opt b{font-size:18px;display:block}.opt small{color:var(--mute);font-size:13.5px;display:block;margin-top:2px;line-height:1.3}
.opt.on{border-color:var(--green);background:var(--c-ok-bg)}.opt.on .rad{border-color:var(--green);background:var(--green)}.opt .rad .ic{width:15px;height:15px;stroke-width:3.5}
/* paper (customer slip) */
.paper{background:#fff;color:#1B2733;border-radius:8px;box-shadow:0 2px 12px rgba(20,40,70,.22);padding:18px 16px;font-size:14.5px}
.paper h3{margin:0;font-size:22px;color:#16324F;font-weight:800}.paper .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;border-bottom:2px solid #16324F;padding-bottom:10px;margin-bottom:10px}
.paper .meta{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px;margin-bottom:10px}.paper .meta span:nth-child(odd){color:#5B6C7F}
.paper table{width:100%;border-collapse:collapse;font-size:14px}.paper th{font-size:12px;color:#5B6C7F;text-align:left;border-bottom:1px solid #C9D3DD;padding:4px 2px;font-weight:600}
.paper td{padding:8px 2px;border-bottom:1px solid #E6ECF1;vertical-align:top}.paper td.r,.paper th.r{text-align:right}
.paper .tots{margin-top:10px;display:flex;flex-direction:column;gap:4px}.paper .tr{display:flex;justify-content:space-between;font-size:15px}
.paper .tr.g{font-size:22px;font-weight:800;color:#16324F;border-top:2px solid #16324F;padding-top:8px;margin-top:4px}
.paper .foot{font-size:12.5px;color:#5B6C7F;margin-top:10px;line-height:1.4}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none}#sheet.open{display:block}
#sheet .scrim{position:absolute;inset:0;background:rgba(5,15,30,.55)}
#sheet .pane{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;max-height:88vh;background:var(--bg);border-radius:24px 24px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
#sheet .sh{padding:16px 16px 8px;display:flex;align-items:center;gap:10px}#sheet .sh h2{margin:0;font-size:21px;flex:1}
#sheet .sb{padding:4px 16px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
#sheet .sf{padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card);display:flex;gap:10px;border-radius:0}
.x{width:40px;height:40px;border-radius:50%;background:var(--seg);display:flex;align-items:center;justify-content:center;color:var(--ink)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 78px);transform:translateX(-50%);background:#16324F;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:80;display:none;max-width:90%;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.list-pick{display:flex;flex-direction:column;background:var(--card);border-radius:16px;overflow:hidden}
.pk{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line);min-height:60px}.pk:last-child{border-bottom:0}
.pk .main{flex:1;text-align:left;min-height:44px;display:flex;flex-direction:column;justify-content:center}.pk .main b{font-size:18px}.pk .main span{font-size:13px;color:var(--mute)}
.pk.sel{background:var(--c-ok-bg)}
.tag{display:inline-block;background:var(--seg);color:var(--ink);border-radius:10px;padding:5px 10px;font-size:14px;font-weight:600;margin:0 6px 6px 0}
.alt{background:var(--card);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.sw{position:relative;width:52px;height:30px;border-radius:15px;background:var(--seg);border:2px solid var(--line);flex:none;transition:.15s}.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--mute);transition:.15s}
.sw.on{background:var(--green);border-color:var(--green)}.sw.on::after{left:24px;background:#fff}
.perm{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);font-size:16px}.perm:last-child{border-bottom:0}
details.u summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px}details.u summary::-webkit-details-marker{display:none}
details.u .pm{padding:0 14px 12px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

rules_note:[`Inches: each side is converted exactly (25.4 mm = 1 inch), then rounded to the nearest whole inch (3.5 goes up). Round bars: the diameter is rounded, then the circle area is worked out. Plates: the cut goes across the width, so the cut face is width × thickness. Cuts: one per piece unless changed. Smallest inches: stops thin plates and small rods from rounding down to 0 (set 0 to turn off).`,`इंच: हर साइड को ठीक-ठीक बदला जाता है (25.4 मिमी = 1 इंच), फिर नज़दीकी पूरे इंच में गोल किया जाता है (3.5 ऊपर जाता है)। गोल बार: डायमीटर गोल होता है, फिर गोले का क्षेत्रफल निकलता है। प्लेट: कट चौड़ाई के आर-पार जाता है, इसलिए कट का हिस्सा चौड़ाई × मोटाई है। कट: हर पीस पर एक, जब तक बदला न जाए। कम से कम इंच: पतली प्लेट और छोटी रॉड को 0 होने से रोकता है (बंद करने के लिए 0 लिखें)।`,`Inch: har side ko theek-theek badla jaata hai (25.4 mm = 1 inch), phir nazdeeki poore inch mein gol kiya jaata hai (3.5 upar jaata hai). Gol bar: diameter gol hota hai, phir gole ka kshetrafal nikalta hai. Plate: cut chaudai ke aar-paar jaata hai, isliye cut ka hissa chaudai × motai hai. Cut: har piece par ek, jab tak badla na jaaye. Kam se kam inch: patli plate aur chhoti rod ko 0 hone se rokta hai (band karne ke liye 0 likho).`],

show_weight_note:[`On by default, so the customer sees the checked weight on the slip. If you'd rather not show it: with weight and material amount both shown, a customer can work out your rate per kg.`,`डिफ़ॉल्ट रूप से चालू है, ताकि ग्राहक को पर्ची पर तौला हुआ वज़न दिखे। अगर आप न दिखाना चाहें: वज़न और माल की रकम दोनों दिखें तो ग्राहक आपका प्रति किलो रेट निकाल सकता है।`,`Default mein on hai, taaki grahak ko parchi par tola hua vazan dikhe. Agar aap na dikhana chahen: vazan aur maal ki rakam dono dikhen to grahak aapka per kilo rate nikaal sakta hai.`],

const inchOf=mm=>{let x=Math.floor(mm/25.4+0.5+1e-9);const m=Number(db.set.minInch)||0;if(m>0)x=Math.max(x,m);return x};
/* sizes may be typed as 2.5 or 2 1/2 or 1/2 */
function parseLen(v){
  if(typeof v==='number')return v;
  const s=String(v??'').trim();if(!s)return NaN;
  const m=s.match(/^(?:(\d+)[\s-]+)?(\d+)\/(\d+)$/);
  if(m){const den=Number(m[3]);return den?(m[1]?Number(m[1]):0)+Number(m[2])/den:NaN}
  return Number(s);
}
const unitOf=it=>it&&it.unit==='in'?'in':'mm';
const toMm=(v,unit)=>{const n=parseLen(v);return unit==='in'?n*25.4:n};
function convLen(v,from,to){
  if(from===to||v===''||v==null)return v;
  const n=parseLen(v);if(!(n>=0))return v;
  const mm=from==='in'?n*25.4:n;
  return to==='in'?String(+(mm/25.4).toFixed(3)):String(+mm.toFixed(2));
}
function resolveRate(matId,custId){const c=db.cust.find(x=>x.id===custId);const m=matById(matId);const sp=c&&c.special&&c.special[matId];return sp!=null&&sp!==''?{rate:Number(sp),special:true}:{rate:m?m.sell:0,special:false}}
/* the last time this grade was sold: to this customer, else to anyone */
function lastSold(custId,matId,excludeId){
  const pool=db.orders.filter(o=>o.id!==excludeId&&o.status!=='estimate');
  const find=list=>{let best=null;list.forEach(o=>o.items.forEach(it=>{if(it.matId===matId&&Number(it.rate)>0&&(!best||new Date(o.at)>new Date(best.at)))best={at:o.at,rate:Number(it.rate),cut:Number(it.cutRate)||0,id:o.id,cust:o.cust}}));return best};
  const mine=custId?find(pool.filter(o=>o.cust===custId)):null;
  return {mine,any:mine?null:find(pool)};
}
function calcItem(it,mode){
  const sh=SHAPES[it.shape];if(!sh)return null;
  const u=unitOf(it);
  const d=(it.d||[]).map(v=>toMm(v,u));
  if(d.length<sh.dims.length||d.slice(0,sh.dims.length).some(v=>!(v>0)))return null;
  const den=Number(it.density);if(!(den>0))return null;
  const rowsIn=(it.rows&&it.rows.length)?it.rows:[{len:it.len,pcs:it.pcs,cuts:it.cuts}];
  const rows=[];
  for(const r of rowsIn){
    const L=sh.len?toMm(r.len,u):0;
    if(sh.len&&!(L>0))return null;
    const pcs=Math.floor(Number(r.pcs));if(!(pcs>0))return null;
    const perPc=sh.vol(d,L)*den/1e9;
    const auto=!(r.cuts!=null&&r.cuts!=='');
    const cuts=auto?pcs:Math.max(0,Math.floor(Number(r.cuts)));
    rows.push({len:r.len,L,pcs,perPc,est:perPc*pcs,cuts,auto});
  }
  const est=rows.reduce((a,r)=>a+r.est,0);
  const pcs=rows.reduce((a,r)=>a+r.pcs,0);
  const totalCuts=rows.reduce((a,r)=>a+r.cuts,0);
  const useAct=mode==='final'&&Number(it.aw)>0;
  const weight=useAct?Number(it.aw):est;
  const rate=Number(it.rate)||0,cr=Number(it.cutRate)||0;
  const mat=r2(weight*rate);
  const sides=sh.sides(d).map(mm=>({mm,raw:mm/25.4,inch:inchOf(mm)}));
  const area=sh.face(sides.map(s=>s.inch));
  const cut=r2(area*cr*totalCuts);
  return {rows,est,weight,useAct,mat,cut,total:r2(mat+cut),sides,area,cuts:totalCuts,pcs,rate,cr,L:rows[0]?rows[0].L:0};
}
/* bill: 'pakka' adds GST, 'kacha' adds the local %, null = plain amount (bill not chosen yet) */
function orderTotals(o,mode,billOv){
  let mat=0,cut=0,wt=0,ok=false;
  (o.items||[]).forEach(it=>{const c=calcItem(it,mode);if(c){mat+=c.mat;cut+=c.cut;wt+=c.weight;ok=true}});
  mat=r2(mat);cut=r2(cut);const base=r2(mat+cut);
  const bill=billOv!==undefined?billOv:o.bill;
  let matK=mat,cutK=cut,gst=0,pct=0;
  if(bill==='kacha'){pct=o.kachaPct??db.set.kachaPct;const f=1+pct/100;matK=r2(mat*f);cutK=r2(cut*f)}
  else if(bill==='pakka'){pct=o.gstPct??db.set.gstPct;gst=r2(base*pct/100)}
  const total=r2(matK+cutK+gst);
  return {mat,cut,base,matK,cutK,gst,total,adj:r2(total-base),pct,wt,ok,bill};
}
const finalTotal=o=>orderTotals(o,o.status==='estimate'||o.status==='accepted'?'est':'final');

function addPay(p){db.pays.push({id:'p'+(db.npay++),at:new Date().toISOString(),oid:null,side:null,kind:'due',...p,amt:r2(p.amt)})}
const paysOf=oid=>db.pays.filter(p=>p.oid===oid);
const advOf=o=>r2(db.pays.filter(p=>p.oid===o.id&&p.kind==='advance').reduce((a,p)=>a+p.amt,0));
const paidOf=o=>r2(paysOf(o.id).reduce((a,p)=>a+p.amt,0));
/* what was still unpaid the moment the order was finished */
function dueOf(o){if(o.status!=='done')return 0;return r2(Math.max(0,orderTotals(o,'final').total-paidOf(o)))}
const me=()=>db.users.find(u=>u.id===db.me)||db.users[0];
const can=p=>!!me().perms[p];
const visSides=()=>can('kacha')?['pakka','kacha']:['pakka'];
const visOrders=()=>db.orders.filter(o=>!o.bill||visSides().includes(o.bill));
const byDate=(a,b)=>new Date(a.date)-new Date(b.date);
function ledger(cid,sides=visSides()){
  const full=sides.length===visSides().length;
  const orders=db.orders.filter(o=>o.cust===cid&&o.status==='done'&&o.inKhata&&sides.includes(o.bill));
  const ids=new Set(orders.map(o=>o.id));
  const bills=orders.map(o=>({t:'bill',date:o.doneAt||o.at,side:o.bill,amt:orderTotals(o,'final').total,oid:o.id}));
  const pay=p=>({t:'pay',date:p.at,side:p.side,amt:p.amt,mode:p.mode,note:p.note,kind:p.kind,oid:p.oid,pid:p.id});
  const linked=db.pays.filter(p=>p.cust===cid&&p.oid&&ids.has(p.oid)).map(pay);
  const loose=db.pays.filter(p=>p.cust===cid&&!p.oid&&sides.includes(p.side)).map(pay);
  const pend=full?db.pays.filter(p=>{if(p.cust!==cid||!p.oid||p.kind!=='advance')return false;const o=db.orders.find(x=>x.id===p.oid);return o&&o.status!=='done'}).map(p=>({...pay(p),pending:true})):[];
  const out={bills,pays:[...linked,...loose,...pend],oldest:null,bySide:{},due:0,adv:0,pend:0};
  const sum=a=>r2(a.reduce((x,y)=>x+y.amt,0));
  sides.forEach(sd=>{
    const bs=bills.filter(b=>b.side===sd).sort(byDate);
    let pool=0;
    bs.forEach(b=>{const lk=sum(linked.filter(p=>p.oid===b.oid));b.rem=r2(Math.max(0,b.amt-lk));pool=r2(pool+Math.max(0,lk-b.amt))});
    pool=r2(pool+sum(loose.filter(p=>p.side===sd)));
    let dueSide=0;
    bs.forEach(b=>{if(b.rem>0){const use=Math.min(pool,b.rem);pool=r2(pool-use);b.rem=r2(b.rem-use)}b.paid=r2(b.amt-b.rem);dueSide+=b.rem;
      if(b.rem>0&&(!out.oldest||new Date(b.date)<new Date(out.oldest)))out.oldest=b.date});
    out.bySide[sd]={due:r2(dueSide),adv:pool};
  });
  out.pend=sum(pend);
  out.due=r2(Object.values(out.bySide).reduce((a,x)=>a+x.due,0));
  out.adv=r2(Object.values(out.bySide).reduce((a,x)=>a+x.adv,0)+out.pend);
  const entries=[...bills,...out.pays].sort(byDate);
  let run=0;entries.forEach(e=>{run=r2(run+(e.t==='bill'?e.amt:-e.amt));e.bal=run});
  out.entries=entries;return out;
}

function summaryToday(){
  const now=new Date().toISOString(),vs=visSides();
  const vo=visOrders();
  const created=vo.filter(o=>sameDay(o.at,now));
  const done=vo.filter(o=>o.status==='done'&&sameDay(o.doneAt||o.at,now));
  let pk=0,kc=0,fromAdv=0,khata=0;
  done.forEach(o=>{const tt=orderTotals(o,'final').total;if(o.bill==='kacha')kc+=tt;else pk+=tt;fromAdv+=Math.min(advOf(o),tt);khata+=dueOf(o)});
  const vis=p=>p.side==null||vs.includes(p.side);
  const today=db.pays.filter(p=>sameDay(p.at,now)&&vis(p));
  const sumK=k=>r2(today.filter(p=>p.kind===k).reduce((a,p)=>a+p.amt,0));
  const spot=sumK('pay'),advTaken=sumK('advance'),collected=sumK('due');
  return {n:created.length,done:done.length,toWeigh:vo.filter(o=>o.status==='accepted').length,ready:vo.filter(o=>o.status==='weighed').length,est:vo.filter(o=>o.status==='estimate').length,
    pk:r2(pk),kc:r2(kc),total:r2(pk+kc),spot,fromAdv:r2(fromAdv),khata:r2(khata),advTaken,collected,moneyIn:r2(spot+advTaken+collected)};
}
/* how much of today's money came in by each mode (cash / UPI / bank / cheque) */
function moneyByMode(){
  const now=new Date().toISOString(),vs=visSides();
  const vis=p=>p.side==null||vs.includes(p.side);
  const today=db.pays.filter(p=>sameDay(p.at,now)&&vis(p));
  const out={};MODES.forEach(m=>out[m]=0);
  today.forEach(p=>{out[p.mode]=r2((out[p.mode]||0)+p.amt)});

/* orders weighed today, so we can compare estimated weight to the actual weighed weight */
function weighedToday(){
  const now=new Date().toISOString();
  return visOrders().filter(o=>o.log.some(l=>l.k==='weighed'&&sameDay(l.at,now)));
}
function wastageStats(){
  const orders=weighedToday();
  let est=0,act=0,n=0;const flags=[];
  orders.forEach(o=>{o.items.forEach((it,i)=>{
    const c=calcItem(it,'est');
    if(c&&Number(it.aw)>0){
      est+=c.est;act+=Number(it.aw);n++;
      const dev=Math.abs(Number(it.aw)-c.est)/c.est*100;
      if(dev>(Number(db.set.warnPct)||5))flags.push({oid:o.id,i,dev:r2(dev),est:c.est,act:Number(it.aw)});
    }
  })});
  const diff=r2(act-est),pct=est>0?r2(diff/est*100):0;
  flags.sort((a,b)=>b.dev-a.dev);
  return {n,est:r2(est),act:r2(act),diff,pct,flags};
}

/* ============ slip numbering ============ */
/* db.next / o.id is the order's PERMANENT internal id — never shown, never resets, used everywhere
   internally for lookups and links. o.slipNo is the label people actually SEE, assigned once when the
   order is created; it can reset daily/monthly/yearly per db.set.numReset so day-to-day numbering feels
   like a fresh book, but a number already given out never changes even if the setting is changed later. */
const MONTH_SHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function slipKeyFor(scheme,iso){
  const d=new Date(iso);
  if(scheme==='daily')return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  if(scheme==='monthly')return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  if(scheme==='yearly'){const y=d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;return y+'-'+(y+1)} // Indian financial year, 1 Apr - 31 Mar
  return 'all';
}
function slipTagFor(scheme,iso){
  const d=new Date(iso),mon=MONTH_SHORT[d.getMonth()];
  if(scheme==='daily')return d.getDate()+mon;
  if(scheme==='monthly')return mon+String(d.getFullYear()).slice(-2);
  if(scheme==='yearly'){const y=d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;return 'FY'+String(y).slice(-2)+'-'+String(y+1).slice(-2)}
  return '';
}
const formatSlipNo=(scheme,iso,n)=>{const tag=slipTagFor(scheme,iso);return tag?`${tag}-${n}`:String(n)};
/* call once, when an order is actually created — consumes the next number and saves it.
   'never' (continuous) just mirrors the order's own permanent internal id, so numbering keeps
   flowing exactly as it always has (no separate counter needed, nothing jumps back to 1). */
function nextSlipNo(contId){
  const scheme=db.set.numReset||'never';
  if(scheme==='never')return String(contId);
  const now=new Date().toISOString(),key=slipKeyFor(scheme,now);
  db.slipCounters=db.slipCounters||{};
  const n=(db.slipCounters[key]||0)+1;db.slipCounters[key]=n;
  return formatSlipNo(scheme,now,n);
}
/* preview only, for "this will be slip #..." before saving — does not consume a number */
function peekSlipNo(){
  const scheme=db.set.numReset||'never';
  if(scheme==='never')return String(db.next);
  const now=new Date().toISOString(),key=slipKeyFor(scheme,now);
  const n=((db.slipCounters||{})[key]||0)+1;
  return formatSlipNo(scheme,now,n);
}
/* the label to show for an order, given just its internal id (for places that only have a payment's oid) */
function slipNoOf(oid){const o=db.orders.find(x=>x.id===oid);return o?(o.slipNo||o.id):oid}

/* old saved orders have items with a single len/pcs/cuts on the item itself;
   bring them into the new rows:[{len,pcs,cuts}] shape so every item is rows-based */
function migrateItems(db){
  (db.orders||[]).forEach(o=>{
    (o.items||[]).forEach(it=>{
      if(!it.rows||!it.rows.length){
        it.rows=[{len:it.len,pcs:it.pcs,cuts:it.cuts||''}];
      }
      delete it.len;delete it.pcs;delete it.cuts;
    });
  });
}

    /* the customer slip now shows the checked weight by default; turn it on once for anyone with older saved data, but leave it alone after that so a manual toggle sticks */
    if(!db.set.wDefaulted){db.set.showWeight=true;db.set.wDefaulted=true}
    if(!db.set.numReset)db.set.numReset='never';
    if(!db.slipCounters)db.slipCounters={};
    /* older saved orders were only ever shown by their internal id — give them that exact same number as their slipNo, so nothing already sent to a customer changes */
    (db.orders||[]).forEach(o=>{if(!o.slipNo)o.slipNo=String(o.id)});

  seedDb();
}

/* words that carry no meaning when searching */
const G_STOP=new Set(['for','the','a','an','what','to','use','can','i','me','my','make','making','is','are','best','which','of','in','and','or','customer','wants','want','need','looking','something','steel','metal','material','should','we','give','with','it','be','how','do','does','कि','के','का','की','में','से','और','क्या','लिए','ke','ka','ki','mein','se','aur','kya','liye','hai','ho','chahiye','banana','banane','चाहिए','बनाना','बनाने','है']);
function guideSearch(q){
  const toks=String(q||'').toLowerCase().split(/[^\p{L}\p{N}ऀ-ॿ]+/u).filter(x=>x&&x.length>=2&&!G_STOP.has(x));
  if(!toks.length)return {toks,hits:[],grades:[]};
  const hits=GUIDE.map(e=>{
    const nm=e.name.join(' ').toLowerCase();let s=0;
    toks.forEach(tk=>{if(nm.includes(tk))s+=3;if(e.kw.split(/\s+/).some(w=>w===tk))s+=3;else if(tk.length>=3&&e.kw.includes(tk))s+=1;
      if(e.pick.some(p=>p[0].toLowerCase()===tk))s+=1});
    return {e,s};
  }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.e);
  const grades=db.mats.filter(m=>toks.some(tk=>m.id.toLowerCase()===tk||(tk.length>=3&&m.id.toLowerCase().startsWith(tk))));
  return {toks,hits,grades};
}

function go(r,p={},replace=false){if(!replace)stack.push(view);view={r,p};render();window.scrollTo(0,0)}

const dimTxt=it=>{const d=it.d.map(num);const s=it.shape;return s==='square'?`${d[0]} × ${d[0]}`:s==='round'?`Ø${d[0]}`:s==='hex'?`${t('hexaf')} ${d[0]}`:s==='plate'?`${d[0]} × ${d[1]} × ${d[2]}`:`${d[0]} × ${d[1]}`};
const itemDesc=it=>`${esc(it.grade)} · ${shapeName(it.shape)} ${dimTxt(it)} ${unitTxt(it)}`;
const itemRows=it=>(it.rows&&it.rows.length)?it.rows:[{len:it.len,pcs:it.pcs,cuts:it.cuts}];
const totalPcs=it=>itemRows(it).reduce((a,r)=>a+(Math.floor(Number(r.pcs))||0),0);
/* one line: single length shows the old "cut length" phrasing, several lengths list each length × its piece count */
function itemDescLen(it){
  const sh=SHAPES[it.shape];if(!sh.len)return itemDesc(it);

const localDateStr=iso=>{const d=new Date(iso);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function inDateFilter(o,r){

}

function weighLines(o,sel=[]){

/* ---- finish: bill type, advance, how paid ---- */
function finCalc(o,p){
  const bill=p.bill||null;
  const tmp={...o,bill,kachaPct:db.set.kachaPct,gstPct:db.set.gstPct};
  const T=orderTotals(tmp,'final',bill);
  const A=advOf(o),B=r2(Math.max(0,T.total-A)),extra=r2(Math.max(0,A-T.total));
  const mode=B<=0?'now':(p.mode||'later');
  const paidNow=mode==='now'?B:mode==='part'?(Number(p.paid)||0):0;
  return {T,A,B,extra,mode,paidNow,due:r2(Math.max(0,B-paidNow)),bill};
}
const finNote=(o,p)=>{const f=finCalc(o,p);if(!f.bill)return '';if(f.due>0)return t('fin_khata_note',money(f.due),esc(custOf(o.cust).name),f.bill==='pakka'?t('pakka'):t('kacha'),o.slipNo);if(f.extra>0)return t('adv_excess',money(f.extra));return t('fin_no_khata')};

  const amt=`<div class="card"><div class="ln"><span>${t('amt_before')}</span><b class="mono">${money2(f.T.base)}</b></div>${adjLine}

  const payBlock=!f.bill?'':f.B<=0?`<div class="info" style="background:var(--c-ok-bg);color:var(--c-ok)">${t('adv_covers')}${f.extra>0?' '+t('adv_excess',money(f.extra)):''}</div>`:
   `<div class="h2" style="font-size:17px">${t('how_paying')}</div>
   ${opt('now',t('paid_now'),t('paid_now_s'))}${opt('later',t('pay_later'),t('pay_later_s'))}${opt('part',t('part_paid'),t('part_paid_s'))}
   ${f.mode!=='later'?`<div><div class="xs muted" style="font-weight:600;margin:0 0 5px">${t('pay_via')}</div><div class="seg">${MODES.map(m=>`<button class="${pm===m?'on':''}" data-act="finPM" data-m="${m}">${m}</button>`).join('')}</div></div>`:''}
   ${f.mode==='part'?`<label class="f"><span>${t('amount_paid_now')}</span><span class="unit"><input class="in" id="partAmt" inputmode="decimal" data-inp="part" value="${esc(p.paid||'')}" placeholder="0"><i>₹</i></span></label>`:''}
   ${f.mode!=='later'?`<label class="f"><span>${t('pay_note')}</span><input class="in" data-inp="finPNote" value="${esc(p.note||'')}" placeholder="${t('pay_note_ph')}"></label>`:''}
   <div class="info" id="finNote" style="${f.due>0?'background:var(--c-ok-bg);color:var(--c-ok)':''}">${finNote(o,p)}</div>`;
  return bar(t('finish'),{sub:`#${o.slipNo} · ${esc(c.name)}`})+`<div class="body">

   ${amt}${payBlock}</div>

/* ---- customer slip (no rates, no per-kg) ---- */
function slipParts(o){
  const T=orderTotals(o,'final'),paid=paidOf(o),bal=r2(Math.max(0,T.total-paid));
  return {T,paid,bal,full:paid>=T.total};
}
function slipText(o){

  let s=`*${sh.name}* — ${t('order_slip')} #${o.slipNo}\n${t('date')}: ${dfmt(o.at,{day:'numeric',month:'short',year:'numeric'})}\n${t('customer')}: ${c.name}${c.phone?` (${c.phone})`:''}\n\n`;
  o.items.forEach((it,i)=>{const cc=calcItem(it,'final'),sh=SHAPES[it.shape],rows=itemRows(it);
    const lenTxt=sh.len?(rows.length<=1?`, ${num(rows[0]?rows[0].len:'')} ${unitTxt(it)}`:` — ${rows.map(r=>`${num(r.len)}${unitTxt(it)}×${Math.floor(Number(r.pcs))||0}`).join(', ')}`):'';
    s+=`${i+1}. ${itemDesc(it)}${lenTxt} — ${totalPcs(it)} ${t('pcs')}${db.set.showWeight&&cc?` — ${kg(cc.weight)}`:''}\n`});

/* ---- khata ---- */
function dueChip(l){const d=l.oldest?daysSince(l.oldest):0;return d>=30?['old','c-bad']:d>=10?['mid','c-amber']:['','c-blue']}
const dueBucket=l=>{const d=l.oldest?daysSince(l.oldest):0;return d>=30?'old':d>=10?'mid':'fresh'};
R.khata=p=>{
  const sort=p.s||'old',bucket=p.b||'all';let L=khataList();
  const q=(p.q||'').toLowerCase();if(q)L=L.filter(x=>x.c.name.toLowerCase().includes(q)||x.c.phone.replace(/\s/g,'').includes(q));
  const allDues=L.filter(x=>x.l.due>0),advs=L.filter(x=>x.l.adv>0&&x.l.due<=0);
  const buckets={fresh:{n:0,amt:0},mid:{n:0,amt:0},old:{n:0,amt:0}};
  allDues.forEach(x=>{const k=dueBucket(x.l);buckets[k].n++;buckets[k].amt=r2(buckets[k].amt+x.l.due)});
  const dues=bucket==='all'?allDues:allDues.filter(x=>dueBucket(x.l)===bucket);
  dues.sort((a,b)=>sort==='old'?new Date(a.l.oldest)-new Date(b.l.oldest):b.l.due-a.l.due);
  const all=khataList(),tot=all.reduce((a,x)=>a+x.l.due,0),adv=all.reduce((a,x)=>a+x.l.adv,0);

  const arow=x=>`<button class="li stripe adv" data-act="go" data-r="customer" data-id="${x.c.id}"><span class="nm"><b>${esc(x.c.name)}</b><span class="xs muted">${t('paid_advance')}</span></span><span class="amt"><b class="mono" style="color:var(--green)">${money(x.l.adv)}</b><span class="chip c-ok">${t('advance')}</span></span></button>`;
  const bcell=(k,lbl,col)=>`<button class="card threecell ${bucket===k?'sel':''}" data-act="khBucket" data-b="${k}"><small>${lbl}</small><b class="mono" style="color:${col}">${buckets[k].n}</b><span class="xs muted">${money(buckets[k].amt)}</span></button>`;
  return bar(t('tile_khata'),{sub:t('who_owes')})+`<div class="body">
   <div class="two"><div class="card"><small>${t('to_receive_cap')}</small><b class="mono" style="color:var(--c-kacha)">${money(tot)}</b></div><div class="card"><small>${t('advances_held')}</small><b class="mono" style="color:var(--green)">${money(adv)}</b></div></div>
   <div class="h2">${t('aging_title')}</div>
   <div class="three">${bcell('fresh',t('due_fresh'),'var(--c-pakka)')}${bcell('mid',t('due_mid'),'var(--c-kacha)')}${bcell('old',t('due_old'),'var(--c-bad)')}</div>
   <label class="search">${ic('search')}<input data-inp="kq" value="${esc(p.q||'')}" placeholder="${t('search_cust')}"></label>
   <div class="seg"><button class="${sort==='old'?'on':''}" data-act="khSort" data-s="old">${t('oldest_first')}</button><button class="${sort==='big'?'on':''}" data-act="khSort" data-s="big">${t('biggest_first')}</button></div>
   <div class="card flush">${dues.length||(bucket==='all'&&advs.length)?dues.map(row).join('')+(bucket==='all'?advs.map(arow).join(''):''):`<div class="li muted">${t('none')}</div>`}</div>
   <div class="info">${t('khata_note')}</div>${can('khata')?`<button class="dash" data-act="addPaymentAny">${ic('plus')}${t('add_payment')}</button>`:''}</div>`;
};
R.customer=p=>{

const gRow=(g,txt,cls)=>`<div class="grow ${cls}"><button class="gchip" data-act="info" data-mat="${esc(g)}"><b>${esc(g)}</b><span class="gi">i</span></button><span>${esc(pick(txt))}</span></div>`;
function guideCard(e,open){
  const cmp=e.id.startsWith('vs_'),[best,...also]=e.pick;
  const sub=cmp?e.pick.map(p=>p[0]).join(' · '):`${t('g_best')}: ${best[0]}${also.length?' · '+also.map(a=>a[0]).join(', '):''}`;
  return `<details class="gcard" ${open?'open':''}><summary><span class="sp"><b style="font-size:17px">${esc(pick(e.name))}</b><div class="xs muted">${esc(sub)}</div></span></summary><div class="gb">
   ${cmp?`<div class="gh">${t('g_diff')}</div>${e.pick.map(p=>gRow(p[0],p[1],'')).join('')}`:
   `<div class="gh">${t('g_best')}</div>${gRow(best[0],best[1],'best')}
   ${also.length?`<div class="gh">${t('g_also')}</div>${also.map(a=>gRow(a[0],a[1],'')).join('')}`:''}
   ${e.avoid.length?`<div class="gh bad">${t('g_avoid')}</div>${e.avoid.map(a=>gRow(a[0],a[1],'no')).join('')}`:''}`}
   <div class="gh" style="color:var(--mute)">${t('g_how')}</div><div class="gtxt">${esc(pick(e.how))}</div>
   <div class="gsay"><b>${t('g_say')}</b><div>“${esc(pick(e.say))}”</div><button class="link" data-act="copy" data-txt="${esc(pick(e.say))}">${ic('copy')}${t('copy_text')}</button></div></div></details>`;
}
function guideResults(q){
  const {toks,hits,grades}=guideSearch(q);
  if(!toks.length){
    return `<div class="h2" style="margin-top:0">${t('g_try')}</div><div class="exs">${GUIDE.filter(e=>!e.id.startsWith('vs_')).slice(0,10).map(e=>`<button class="pill" data-act="gset" data-q="${esc(pick(e.name))}">${esc(pick(e.name))}</button>`).join('')}</div>
     <div class="h2">${t('g_all')}</div>${GUIDE.map(e=>guideCard(e,false)).join('')}`;
  }
  const gr=grades.length?`<div class="h2" style="margin-top:0">${t('g_grades')}</div><div class="card flush">${grades.map(m=>`<button class="li" data-act="info" data-mat="${esc(m.id)}"><span class="nm"><b>${esc(m.id)}</b><span class="xs muted">${famName(m.family)}${m.info?' · '+esc(m.info.eq):''}</span></span><span class="infob">i</span></button>`).join('')}</div>`:'';
  const cards=hits.slice(0,6).map((e,i)=>guideCard(e,i===0)).join('');
  if(!gr&&!cards)return `<div class="card"><b>${t('g_none')}</b><div class="small muted" style="margin-top:4px">${t('g_none_s')}</div></div><div class="h2">${t('g_try')}</div><div class="exs">${GUIDE.filter(e=>!e.id.startsWith('vs_')).slice(0,8).map(e=>`<button class="pill" data-act="gset" data-q="${esc(pick(e.name))}">${esc(pick(e.name))}</button>`).join('')}</div>`;
  return gr+cards;

function askPrompt(q){
  const lang={en:'simple English',hi:'simple Hindi in Devanagari script',hn:'Hinglish (Hindi written in English letters)'}[db.lang]||'simple English';
  const stock=db.mats.filter(m=>m.active).map(m=>`${m.id} (${famName(m.family)})`).join(', ');
  return `You are the helper inside the app of a steel trading shop in India. The shop sells and cuts (bandsaw) steel bars, flats and plates. A shopkeeper or worker asks you a question so they can advise a customer.
Grades in stock: ${stock}.
Rules:
- Answer in ${lang}. Very simple words, no jargon. Maximum 8 short lines. No headings, no markdown symbols, no tables.
- Say what to use and why. If useful, say how to work it (machining, welding, heat treatment) and what to watch out for.
- Prefer grades from the stock list. If nothing in stock fits, say so and name the closest option. Do not invent grades or facts.

  },

  saveCashClose:()=>{const el=$('#cashCount');const counted=Number(el&&el.value)||0;const key=new Date().toISOString().slice(0,10);
    db.cashClose=db.cashClose||{};db.cashClose[key]={expected:moneyByMode().Cash||0,counted,by:me().name,at:new Date().toISOString()};
    save();view.p.cc=null;toast(t('cash_saved'));render()}
};
function fallbackCopy(txt){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()}

/* input handlers (no full re-render, so typing keeps focus) */
const INP={
  dim:el=>{const it=draft.items[+el.dataset.i];it.d[+el.dataset.j]=el.value;refreshDraft(+el.dataset.i)},
  rlen:el=>{draft.items[+el.dataset.i].rows[+el.dataset.j].len=el.value;refreshDraft(+el.dataset.i)},
  rpcs:el=>{const it=draft.items[+el.dataset.i],j=+el.dataset.j;it.rows[j].pcs=el.value;refreshDraft(+el.dataset.i);const c=el.closest('.rowline').querySelector('[data-inp=rcuts]');if(c)c.placeholder=el.value||'auto'},
  rcuts:el=>{draft.items[+el.dataset.i].rows[+el.dataset.j].cuts=el.value;refreshDraft(+el.dataset.i)},
  rgDate:el=>{view.p={...view.p,range:{...(view.p.range||{}),date:el.value}};render()},
  rgMonth:el=>{view.p={...view.p,range:{...(view.p.range||{}),month:el.value}};render()},
  rgFrom:el=>{view.p={...view.p,range:{...(view.p.range||{}),from:el.value}};render()},
  rgTo:el=>{view.p={...view.p,range:{...(view.p.range||{}),to:el.value}};render()},
  rate:el=>{const it=draft.items[+el.dataset.i];it.rate=el.value;it.special=false;refreshDraft(+el.dataset.i)},
  crate:el=>{draft.items[+el.dataset.i].cutRate=el.value;refreshDraft(+el.dataset.i)},
  aw:el=>{const o=db.orders.find(x=>x.id==view.p.id);o.items[+el.dataset.i].aw=el.value===''?null:el.value;save();refreshWeigh(o,+el.dataset.i)},
  part:el=>{view.p.paid=el.value;const o=db.orders.find(x=>x.id==view.p.id),n=$('#finNote');if(n){n.textContent=finNote(o,view.p)}},
  advAmt:el=>{draft.adv.amt=el.value},
  advNote:el=>{draft.adv.note=el.value},
  finPNote:el=>{view.p.note=el.value},
  cashCount:el=>{view.p.cc=el.value;const d=$('#cashDiff');if(d)d.innerHTML=cashDiffHtml(Number(el.value)||0,moneyByMode().Cash||0)},
  gq:el=>{view.p.q=el.value;const r=$('#gres');if(r)r.innerHTML=guideResults(el.value)},  kq:el=>{view.p.q=el.value;const pos=el.selectionStart;render();const n=document.querySelector('[data-inp=kq]');if(n){n.focus();n.setSelectionRange(pos,pos)}},
  mq:el=>matPickSheet(sheetCtx.i,sheetCtx.fam,el.value),
  cq:el=>custSheet(el.value),
  msell:el=>{db.mats[+el.dataset.i].sell=Number(el.value)||0;save()},
  mcut:el=>{db.mats[+el.dataset.i].cut=Number(el.value)||0;save()},
  mden:el=>{db.mats[+el.dataset.i].density=el.value===''?null:Number(el.value);save()},
  famd:el=>{const v=Number(el.value);if(v>0){FAMILIES[el.dataset.f].d=v;db.fam=db.fam||{};db.fam[el.dataset.f]=v;save()}},
  s_kachaPct:el=>{db.set.kachaPct=Number(el.value)||0;save()},
  s_minInch:el=>{db.set.minInch=Number(el.value)||0;save()},
  s_gstPct:el=>{db.set.gstPct=Number(el.value)||0;save()},
  s_warnPct:el=>{db.set.warnPct=Number(el.value)||0;save()},
  s_shopname:el=>{db.set.shop.name=el.value;save()},s_shopphone:el=>{db.set.shop.phone=el.value;save()},s_shopgst:el=>{db.set.shop.gst=el.value;save()}
};
const CHG={me:el=>{db.me=el.value;save();render()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f){if(b.tagName==='A'&&b.dataset.act==='')return;f(b.dataset,b,e)}});
document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.inp&&INP[e.target.dataset.inp];if(f)f(e.target)});
document.addEventListener('change',e=>{const f=e.target.dataset&&e.target.dataset.chg&&CHG[e.target.dataset.chg];if(f)f(e.target)});
load();render();
</script>

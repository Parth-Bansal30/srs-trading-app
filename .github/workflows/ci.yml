name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core-tests:
    name: Business rules (${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Indian time runs the full side-by-side check against the prototype;
        # UTC proves the rules are right on a server that isn't on Indian time.
        tz: [Asia/Kolkata, UTC]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        working-directory: packages/core
        env:
          TZ: ${{ matrix.tz }}
        run: node --test "test/**/*.test.js"
      - name: Backend operations (unit tests)
        env:
          TZ: ${{ matrix.tz }}
        run: node --test supabase/functions/api/ops.test.mjs
      - name: App - offline entries, lock rules, voice words (unit tests)
        run: node --test apps/web/test/overlay.test.mjs apps/web/test/autolock.test.mjs apps/web/test/speech.test.mjs
